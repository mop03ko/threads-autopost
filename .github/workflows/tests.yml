name: Reliability tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.py', 'cloudflare-worker/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests pyyaml 'Pillow>=10.4,<12'
      - run: python -m unittest discover -s tests -v
      - run: npm test --prefix cloudflare-worker
