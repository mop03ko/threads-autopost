name: Recover approved failed posts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/recovery-batch.json', '.github/workflows/recover-failed-posts.yml']
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      THREADS_QUEUE_BRANCH: main
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_TZ: Asia/Ulaanbaatar
      THREADS_SHEET_ID: ${{ secrets.THREADS_SHEET_ID }}
      THREADS_SHEET_GID: '1131908690'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-urw-base35
          pip install --quiet -r requirements.txt boto3
      - name: Execute the finite reviewed recovery batch
        run: python recover_failed_posts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-post-recovery
          path: recovery-report.json
          if-no-files-found: ignore
