name: Deploy reviewed movie posters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'movie-posters/**'
      - 'deploy_movie_posters.py'
      - '.github/workflows/movie-posters.yml'
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      THREADS_SHEET_ID: ${{ secrets.THREADS_SHEET_ID }}
      THREADS_SHEET_GID: '1131908690'
      GITHUB_TOKEN: ${{ github.token }}
      THREADS_QUEUE_BRANCH: main
      THREADS_TZ: Asia/Ulaanbaatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt boto3
      - run: python threads_post.py sync
      - name: Verify, upload and assign reviewed main posters
        run: python deploy_movie_posters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movie-poster-deployment
          path: movie-poster-deployment.json
          if-no-files-found: ignore
