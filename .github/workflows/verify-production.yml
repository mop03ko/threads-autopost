name: Verify production connections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-production.yml']
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      THREADS_QUEUE_BRANCH: main
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_SHEET_ID: ${{ secrets.THREADS_SHEET_ID }}
      THREADS_SHEET_GID: ${{ vars.THREADS_SHEET_GID || '1131908690' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      THREADS_TZ: Asia/Ulaanbaatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt
      - name: Verify Threads access without publishing
        run: |
          python - <<'PY'
          import os
          import threads_post as app
          result = app.api('GET', f'{app.GRAPH}/me', params={
              'access_token': os.environ['THREADS_ACCESS_TOKEN'], 'fields': 'id'})
          if not result.get('id'):
              raise SystemExit('Threads account verification failed')
          print('Threads account access verified. No post created.')
          PY
      - name: Validate Sheets and merge current remote queue
        run: python threads_post.py sync
      - name: Preview due posts without publishing
        run: python threads_post.py run
