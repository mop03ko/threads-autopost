name: Generate unpublished post images with Magnific

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "pilot generates a limited sample; all generates every unpublished post"
        required: true
        default: pilot
        type: choice
        options: [pilot, all]
      limit:
        description: "Number of images when scope is pilot"
        required: true
        default: "10"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/magnific-batch.txt"

permissions:
  contents: write

concurrency:
  group: magnific-generate-unpublished
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      THREADS_SHEET_ID: ${{ secrets.THREADS_SHEET_ID }}
      THREADS_SHEET_GID: "1131908690"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt boto3

      - name: Resolve batch settings
        id: settings
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          scope="$INPUT_SCOPE"
          limit="$INPUT_LIMIT"
          if [[ -z "$scope" && -f .github/magnific-batch.txt ]]; then
            IFS=: read -r scope limit < .github/magnific-batch.txt
          fi
          [[ "$scope" == "all" || "$scope" == "pilot" ]] || { echo "Invalid scope." >&2; exit 1; }
          [[ "$limit" =~ ^[0-9]+$ ]] || limit="10"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"

      - name: Generate, upload and sync
        run: |
          python magnific_generate_batch.py \
            --scope "${{ steps.settings.outputs.scope }}" \
            --limit "${{ steps.settings.outputs.limit }}" \
            --workers 1 \
            --run-token "${GITHUB_RUN_ID}"

      - name: Commit updated queue
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          if git diff --cached --quiet; then
            echo "queue.json is already current."
            exit 0
          fi
          git commit -m "Magnific images generated for unpublished posts [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Upload batch manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: magnific-batch-${{ github.run_id }}
          path: magnific-batch-manifest.json
          if-no-files-found: ignore
