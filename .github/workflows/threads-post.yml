name: Threads автомат постлолт

on:
  schedule:
    # Бүх cron UTC. Asia/Ulaanbaatar = UTC+8.
    # Exact нийтлэх цагууд:
    # 08:30, 20:30 Ulaanbaatar
    - cron: "30 0,12 * * *"
    # 10:00, 13:00, 16:00, 19:00, 22:00 Ulaanbaatar
    - cron: "0 2,5,8,11,14 * * *"
    # Exact schedule GitHub дээр саатах/алдагдах үед нөхөх fallback.
    # Цаг бүрийн :07, :17, :27, :37, :47, :57-д шалгана.
    - cron: "7-57/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/manual-post-id.txt"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Шууд нийтлэх постын ID (хоосон бол хуваариар ажиллана)"
        required: false
        type: string

concurrency:
  group: threads-post       # хоёр ажиллагаа зэрэг явахаас сэргийлнэ
  cancel-in-progress: false

permissions:
  contents: write           # queue.json-ийн SHA-тай API шинэчлэлтэд хэрэгтэй

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      THREADS_APP_ID:       ${{ secrets.THREADS_APP_ID }}
      THREADS_APP_SECRET:   ${{ secrets.THREADS_APP_SECRET }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_SHEET_ID:     ${{ secrets.THREADS_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      THREADS_REDIRECT_URI: https://localhost/threads-auth
      THREADS_TZ:           Asia/Ulaanbaatar
      THREADS_LATE_GRACE:   "90"
      THREADS_SHEET_GID:    ${{ vars.THREADS_SHEET_GID || '1131908690' }}
      THREADS_QUEUE_BRANCH: main
      GITHUB_TOKEN:        ${{ github.token }}
      GH_PAT:               ${{ secrets.GH_PAT }}

    steps:
      - name: Кодыг татах
        uses: actions/checkout@v4

      - name: Python бэлтгэх
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Хамаарал суулгах
        run: pip install --quiet -r requirements.txt

      - name: Токен бэлтгэх
        run: python threads_post.py token-import

      - name: Google Sheet-ээс татах
        run: python threads_post.py sync

      - name: Хугацаа болсон эсвэл сонгосон постыг нийтлэх
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_POST_ID: ${{ github.event.inputs.post_id || '' }}
        run: |
          post_id="$MANUAL_POST_ID"

          # manual-post-id.txt нь зөвхөн тухайн файлын push trigger үед хүчинтэй.
          # Scheduled ажиллагаа өмнөх ID-г дахин ашиглах ёсгүй.
          if [[ "$EVENT_NAME" == "push" && -f .github/manual-post-id.txt ]]; then
            IFS= read -r post_id < .github/manual-post-id.txt
          fi

          if [[ -n "$post_id" ]]; then
            if [[ ! "$post_id" =~ ^[0-9,[:space:]]+$ ]]; then
              echo "::error::Post ID нь зөвхөн эерэг бүхэл тоо байна."
              exit 1
            fi
            IFS=', ' read -r -a post_ids <<< "$post_id"
            ids=()
            for id in "${post_ids[@]}"; do
              [[ -z "$id" ]] || ids+=("$id")
            done
            [[ ${#ids[@]} -gt 0 ]] || exit 1
            python threads_post.py run --live --id "${ids[@]}"
          else
            python threads_post.py run --live
          fi

      - name: Google Sheet-ийн төлөвийг шинэчлэх
        if: ${{ always() && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        continue-on-error: true
        run: python threads_post.py sheet-status

      - name: Токеныг шинэчлэх
        if: ${{ always() && env.GH_PAT != '' && hashFiles('token.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          trap 'rm -f token.txt' EXIT
          python threads_post.py token-export --out token.txt
          gh secret set THREADS_ACCESS_TOKEN < token.txt
          rm -f token.txt
          echo "Токен GitHub Secret дээр шинэчлэгдлээ."

      - name: Токен дуусахад ойртсон эсэхийг шалгах
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          f = pathlib.Path("token.json")
          if not f.exists():
              raise SystemExit(0)
          tok = json.loads(f.read_text(encoding="utf-8"))
          exp = datetime.datetime.fromisoformat(tok["expires_at"])
          days = (exp - datetime.datetime.now(exp.tzinfo)).days
          print(f"Токен дуусах хүртэл {days} хоног.")
          if days < 7:
              print("::warning::Токен удахгүй дуусна. Дахин зөвшөөрөл авна уу.")
          PY
