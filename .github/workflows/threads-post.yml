name: Threads автомат постлолт

on:
  schedule:
    # Cloudflare Worker үндсэн нийтлэгч. Энэ cron нь зөвхөн нөөц ажиллагаа:
    # Цагт хоёр удаа шалгаж, Worker саатсан үед хоцорсон постыг нөхнө.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/manual-post-id.txt"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Шууд нийтлэх постын ID (хоосон бол хуваариар ажиллана)"
        required: false
        type: string

concurrency:
  group: threads-post       # хоёр ажиллагаа зэрэг явахаас сэргийлнэ
  cancel-in-progress: false

permissions:
  contents: write           # queue.json-г буцааж commit хийхэд хэрэгтэй

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      THREADS_APP_ID:       ${{ secrets.THREADS_APP_ID }}
      THREADS_APP_SECRET:   ${{ secrets.THREADS_APP_SECRET }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_SHEET_ID:     ${{ secrets.THREADS_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      THREADS_REDIRECT_URI: https://localhost/threads-auth
      THREADS_TZ:           Asia/Ulaanbaatar
      THREADS_LATE_GRACE:   "10080"
      GH_PAT:               ${{ secrets.GH_PAT }}

    steps:
      - name: Кодыг татах
        uses: actions/checkout@v4

      - name: Python бэлтгэх
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Хамаарал суулгах
        run: pip install --quiet -r requirements.txt

      - name: Токен бэлтгэх
        run: python threads_post.py token-import

      - name: Google Sheet-ээс татах
        run: python threads_post.py sync
        continue-on-error: true      # Sheet унтарсан ч постлолт үргэлжилнэ

      - name: Хугацаа болсон эсвэл сонгосон постыг нийтлэх
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_POST_ID: ${{ github.event.inputs.post_id || '' }}
        run: |
          post_id="$MANUAL_POST_ID"

          # manual-post-id.txt нь зөвхөн тухайн файлын push trigger үед хүчинтэй.
          # Scheduled ажиллагаа өмнөх ID-г дахин ашиглах ёсгүй.
          if [[ "$EVENT_NAME" == "push" && -f .github/manual-post-id.txt ]]; then
            IFS= read -r post_id < .github/manual-post-id.txt
          fi

          if [[ -n "$post_id" ]]; then
            # Нэг ID эсвэл таслал/зайгаар тусгаарласан олон ID дэмжинэ.
            # Нэг пост алдаа өгсөн ч batch-ийн үлдсэн постууд үргэлжилнэ.
            IFS=', ' read -r -a post_ids <<< "$post_id"
            for id in "${post_ids[@]}"; do
              [[ -z "$id" ]] && continue
              echo "Гар аргаар нийтлэх post ID: $id"
              if ! python threads_post.py run --live --id "$id"; then
                echo "::warning::Post ID $id нийтлэхэд алдаа гарлаа; дараагийн ID руу үргэлжилж байна."
              fi
            done
          else
            echo "Хуваарьт ажиллагаа: хугацаа болсон постуудыг нөхөж байна."
            python threads_post.py run --live --force
          fi

      - name: Ээлжийн төлөвийг хадгалах
        run: |
          if git diff --quiet -- queue.json; then
            echo "Өөрчлөлт алга."
            exit 0
          fi
          git config user.name  "threads-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          git commit -m "Ээлж шинэчлэв [skip ci]"
          # Зэрэг ажиллагаанаас үүдэх зөрчлийг зөөлөн барина
          git pull --rebase --autostash || true
          git push

      - name: Google Sheet-ийн төлөвийг шинэчлэх
        if: ${{ always() && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        continue-on-error: true
        run: python threads_post.py sheet-status

      - name: Токеныг шинэчлэх
        if: ${{ env.GH_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python threads_post.py token-export --out token.txt
          gh secret set THREADS_ACCESS_TOKEN < token.txt
          rm -f token.txt
          echo "Токен GitHub Secret дээр шинэчлэгдлээ."

      - name: Токен дуусахад ойртсон эсэхийг шалгах
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          f = pathlib.Path("token.json")
          if not f.exists():
              raise SystemExit(0)
          tok = json.loads(f.read_text(encoding="utf-8"))
          exp = datetime.datetime.fromisoformat(tok["expires_at"])
          days = (exp - datetime.datetime.now(exp.tzinfo)).days
          print(f"Токен дуусах хүртэл {days} хоног.")
          if days < 7:
              print("::warning::Токен удахгүй дуусна. Дахин зөвшөөрөл авна уу.")
          PY
